<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Web Playback Player</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .player-card { background: #181818; width: 320px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        img { width: 220px; height: 220px; border-radius: 8px; margin-bottom: 15px; background: #282828; }
        button { background: #1DB954; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 25px; cursor: pointer; margin: 5px; }
        button:hover { transform: scale(1.04); background: #1ed760; }
        .status { color: #b3b3b3; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Spotify Embedded SDK Player</h2>
    <div class="player-card">
        <img id="album-art" src="" alt="Waiting for playback...">
        <h3 id="track-name">No Track Loading</h3>
        <p id="artist-name">-</p>
        
        <button onclick="login()">🔗 Authenticate Player</button><br><br>
        <button id="togglePlay">⏯️ Play / Pause</button>
        <div id="device-status" class="status">Status: Disconnected</div>
    </div>

    <!-- Core Spotify Playback SDK Library Script Injection -->
    <script src="https://scdn.co"></script>
    <script>
        // 🔴 UPDATE WITH YOUR DATA
        const CLIENT_ID = '2a84e3850762463f8cce3fa61c81052a'; 
        const REDIRECT_URI = 'https://github.io';

        function login() {
            const scopes = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
            window.location = `https://spotify.com{CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scopes)}`;
        }

        const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
            if (item) { var parts = item.split('='); initial[parts] = decodeURIComponent(parts); }
            return initial;
        }, {});
        const token = hash.access_token;
        if(token) { window.location.hash = ""; }

        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!token) return;

            const player = new Spotify.Player({
                name: 'Chromebook Virtual Speaker',
                getOAuthToken: cb => { cb(token); },
                volume: 0.5
            });

            player.addListener('ready', ({ device_id }) => {
                document.getElementById('device-status').innerText = "Status: Online! (Device Ready)";
                console.log('Ready with Device ID', device_id);
                transferPlaybackHere(device_id);
            });

            player.addListener('player_state_changed', state => {
                if (!state) return;
                const currentTrack = state.track_window.current_track;
                document.getElementById('track-name').innerText = currentTrack.name;
                document.getElementById('artist-name').innerText = currentTrack.artists.name;
                document.getElementById('album-art').src = currentTrack.album.images.url;
            });

            document.getElementById('togglePlay').onclick = function() {
                player.togglePlay();
            };

            player.connect();
        };

        async function transferPlaybackHere(deviceId) {
            await fetch('https://spotify.com', {
                method: 'PUT',
                body: JSON.stringify({ device_ids: [deviceId], play: true }),
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });
        }
    </script>
</body>
</html>
